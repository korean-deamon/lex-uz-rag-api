<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Qonunchilik AI | lex.uz asosida</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">⚖️ Qonunchilik<span>AI</span></div>
    <div class="subtitle">lex.uz ma'lumotlari asosida ishlaydigan yordamchi</div>
  </header>

  <main class="landing">
    <section class="hero">
      <h1>O'zbekiston qonunchiligi bo'yicha savol bering</h1>
      <p>Javoblar faqat lex.uz'dan olingan rasmiy hujjatlar asosida beriladi.</p>
    </section>

    <section class="chat-window" id="chatWindow">
      <div class="msg bot">
        Salom! Men lex.uz bazasidagi qonun hujjatlari asosida javob beraman.
        Nimani bilmoqchisiz?
      </div>
    </section>
  </main>

  <footer class="input-bar">
    <input id="chatInput" type="text" placeholder="Savolingizni shu yerga yozing..." autocomplete="off" />
    <button id="sendBtn">Yuborish</button>
  </footer>

  <script src="/static/script.js"></script>
</body>
</html>
